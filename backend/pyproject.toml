[project]
name = "pipeline-backend"
version = "0.1.0"
description = "Pipeline backend API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
# This is an application, not a library: don't try to build/install the project
# itself, just resolve and install the dependencies above.
package = false
